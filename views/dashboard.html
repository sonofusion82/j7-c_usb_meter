<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="initial-idx" content="{{initial_idx}}">
  <title>USB Power Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <h1>USB Power Monitor</h1>

  <div class="metrics">
    <div class="metric">
      <span class="label">Voltage</span>
      <span class="value voltage" id="m-voltage">--</span>
      <span class="unit">V</span>
    </div>
    <div class="metric">
      <span class="label">Current</span>
      <span class="value current" id="m-current">--</span>
      <span class="unit">A</span>
    </div>
    <div class="metric">
      <span class="label">Power</span>
      <span class="value power" id="m-power">--</span>
      <span class="unit">W</span>
    </div>
    <div class="metric">
      <span class="label">Energy</span>
      <span class="value energy" id="m-wh">--</span>
      <span class="unit">Wh</span>
    </div>
    <div class="metric">
      <span class="label">Charge</span>
      <span class="value" id="m-mah">--</span>
      <span class="unit">mAh</span>
    </div>
    <div class="metric">
      <span class="label">D+</span>
      <span class="value" id="m-dplus">--</span>
      <span class="unit">V</span>
    </div>
    <div class="metric">
      <span class="label">D&minus;</span>
      <span class="value" id="m-dminus">--</span>
      <span class="unit">V</span>
    </div>
    <div class="metric">
      <span class="label">Temp</span>
      <span class="value" id="m-temp">--</span>
      <span class="unit">&deg;C</span>
    </div>
    <div class="metric">
      <span class="label">Duration</span>
      <span class="value duration" id="m-duration">--:--</span>
      <span class="unit">&nbsp;</span>
    </div>
  </div>

  <div class="chart-wrap">
    <div id="status">Waiting for data&hellip;</div>
    <canvas id="chart"></canvas>
  </div>

  <script src="/static/js/dashboard.js"></script>
</body>
</html>
